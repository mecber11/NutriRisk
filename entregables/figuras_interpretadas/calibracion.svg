<rect x="0" y="447.240047" width="580.534297" height="122" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#213744"><text x="22" y="472.240047">Cómo leer: Cada punto compara probabilidad media predicha con frecuencia observada por intervalos; la diagonal es</text><text x="22" y="485.240047">calibración perfecta.</text><text x="22" y="504.240047">Interpretación: Desviaciones de la diagonal indican probabilidades sobreestimadas o subestimadas en los grupos</text><text x="22" y="517.240047">evaluados.</text><text x="22" y="536.240047">Alcance: Discriminación y calibración son distintas. La demostración no acredita probabilidades calibradas para pacientes</text><text x="22" y="549.240047">reales.</text></g></svg>
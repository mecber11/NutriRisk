<rect x="0" y="447.240047" width="796.534297" height="83" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#213744"><text x="22" y="472.240047">Cómo leer: El eje horizontal muestra épocas y el vertical la pérdida de entrenamiento estandarizada por región excluida.</text><text x="22" y="491.240047">Interpretación: La reducción de pérdida indica ajuste sobre los datos de entrenamiento; oscilaciones pueden reflejar el proceso de optimización.</text><text x="22" y="510.240047">Alcance: No son curvas de validación. Una pérdida menor no demuestra mejor generalización ni excluye sobreajuste.</text></g></svg>
<rect x="0" y="446.936859" width="726.854687" height="96" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#213744"><text x="22" y="471.936859">Cómo leer: La barra indica MAE y la línea su intervalo bootstrap regional; todos los modelos estiman el mismo objetivo territorial.</text><text x="22" y="490.936859">Interpretación: Una barra menor indica menor error medio. El solapamiento de intervalos advierte incertidumbre y debe considerarse junto a las pruebas</text><text x="22" y="503.936859">pareadas.</text><text x="22" y="522.936859">Alcance: Los intervalos son exploratorios con cinco regiones; el orden numérico no acredita superioridad clínica.</text></g></svg>
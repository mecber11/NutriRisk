<rect x="0" y="562.640047" width="698.4" height="96" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#213744"><text x="22" y="587.640047">Cómo leer: Las capas muestran el recorrido desde adquisición y automatización hasta modelos, almacenamiento y resultados.</text><text x="22" y="606.640047">Interpretación: El agente consulta y explica evidencia; el motor predictivo calcula estimaciones. Sus funciones y evidencias se mantienen</text><text x="22" y="619.640047">diferenciadas.</text><text x="22" y="638.640047">Alcance: n8n, LangFlow, PostgreSQL y MinIO requieren comprobar su despliegue; el diagrama no certifica que estén activos.</text></g></svg>
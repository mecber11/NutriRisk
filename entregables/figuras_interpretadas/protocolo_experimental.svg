<rect x="0" y="360.720047" width="642.6" height="83" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#213744"><text x="22" y="385.720047">Cómo leer: El ajuste usa etiquetas hasta 2022; las etiquetas de 2023 se reservan para evaluar regiones excluidas.</text><text x="22" y="404.720047">Interpretación: La separación reduce la reutilización del resultado final durante la búsqueda de hiperparámetros.</text><text x="22" y="423.720047">Alcance: Se conocen covariables de 2023: es estimación contemporánea, no pronóstico sin datos futuros; la muestra es sintética.</text></g></svg>
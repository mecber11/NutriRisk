name: nutririsk

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nutririsk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutririsk}
      POSTGRES_USER: ${POSTGRES_USER:-nutririsk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutririsk}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutririsk} -d ${POSTGRES_DB:-nutririsk}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [nutririsk]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_TORCH: ${INSTALL_TORCH:-true}
    container_name: nutririsk-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nutririsk}:${POSTGRES_PASSWORD:-nutririsk}@db:5432/${POSTGRES_DB:-nutririsk}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DEMO_MODE: ${DEMO_MODE:-true}
      AUTO_SEED: "false"
      SEED_TRAIN: ${SEED_TRAIN:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-nutririsk-n8n-token}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      LANGFLOW_BASE_URL: http://langflow:7860
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-nutririsk}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - backend_artifacts:/app/backend/artifacts
      - backend_storage:/app/backend/storage
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [nutririsk]

  web:
    build:
      context: ./frontend
    container_name: nutririsk-web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [nutririsk]

  n8n:
    image: n8nio/n8n:latest
    container_name: nutririsk-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-nutririsk2026}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      NUTRIRISK_API_URL: http://api:8000
      NUTRIRISK_API_TOKEN: ${N8N_WEBHOOK_TOKEN:-nutririsk-n8n-token}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    networks: [nutririsk]

  langflow:
    image: langflowai/langflow:latest
    container_name: nutririsk-langflow
    restart: unless-stopped
    environment:
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_SKIP_AUTH_AUTO_LOGIN: "true"
      LANGFLOW_HOST: 0.0.0.0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - langflow_data:/app/langflow
      - ./langflow:/flows:ro
    ports:
      - "${LANGFLOW_PORT:-7860}:7860"
    networks: [nutririsk]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    profiles: [research]
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts", "--serve-artifacts"]
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "127.0.0.1:5000:5000"
    networks: [nutririsk]

  minio:
    image: minio/minio:latest
    profiles: [research]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nutririsk-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nutririsk-local-demo-only}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [nutririsk]

volumes:
  pgdata:
  n8n_data:
  langflow_data:
  backend_artifacts:
  backend_storage:
  mlflow_data:
  minio_data:

networks:
  nutririsk:
    driver: bridge

